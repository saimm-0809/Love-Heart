<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love Heart</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; background: #12040f; overflow: hidden; }
  html, body { overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<canvas id="c" aria-label="A heart made of the words I love you in 72 languages, surrounded by lilies"></canvas>
<script>
(function () {
  var W = 800, CY = 370, HH = 800, K = W * 0.9 / 34;
  var FONT = '"Segoe UI","Noto Sans","Helvetica Neue",Arial,"Noto Sans CJK JP","Noto Sans Devanagari","Noto Sans Thai","Noto Sans Arabic","Noto Sans Hebrew","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Georgian","Noto Sans Armenian","Malgun Gothic","Microsoft YaHei",sans-serif';
  // 72 languages. Index 0 is English.
  var PHRASES = [
    "I love you","Seni seviyorum","Te amo","Je t'aime","Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю","사랑해","愛してる",
    "我爱你","मैं तुमसे प्यार करता हूँ","Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię","ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тебе кохаю",
    "أحبك","אני אוהב אותך","دوستت دارم","مجھے تم سے محبت ہے","আমি তোমাকে ভালোবাসি","நான் உன்னை காதலிக்கிறேன்","నేను నిన్ను ప్రేమిస్తున్నాను","मी तुझ्यावर प्रेम करतो","હું તને પ્રેમ કરું છું","ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ",
    "ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ","ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു","म तिमीलाई माया गर्छु","මම ඔබට ආදරෙයි","Saya cintakan awak","Mahal kita","Nakupenda","Ngiyakuthanda","Ek is lief vir jou","Ina son ka",
    "Mo nifẹ rẹ","A hụrụ m gị n'anya","እወድሃለሁ","Waan ku jeclahay","Jeg elsker deg","Jeg elsker dig","Minä rakastan sinua","Ég elska þig","Miluji tě","Milujem ťa",
    "Szeretlek","Te iubesc","Обичам те","Волим те","Volim te","Ljubim te","Të dua","Те сакам","Aš tave myliu","Es tevi mīlu",
    "Ma armastan sind","მე შენ მიყვარხარ","Ես քեզ սիրում եմ","Mən səni sevirəm","Мен сені жақсы көремін","Men seni sevaman","Би чамд хайртай","Tá grá agam duit","Dw i'n dy garu di","Tha gaol agam ort",
    "T'estimo","Maite zaitut"
  ];
  var GLOW = "rgba(255,110,175,.7)";

  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  var vw = 0, vh = 0, S = 1, bg, pollen = [], fall = [];

  var seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  // layout state (rebuilt whenever the screen type changes, e.g. phone upright vs sideways)
  var poly, MASK, wcache, items, blocks, fillIdx, grid, GN = 32, GR = 32, G = 25;
  var order, hero, doneAt, M = 1, MB = 1, MG = 1, SY = 1, layoutKey = "";
  var deck, pend, pendFails, placed, prePlaced = {};

  // screen -> layout settings. Desktop: exactly as before. Phone: taller heart + bigger words so everything is readable.
  function settings() {
    var vw_ = window.innerWidth, vh_ = window.innerHeight;
    var mobile = Math.min(vw_, vh_) < 600, portrait = vw_ < vh_;
    var s = Math.min(vw_ / (portrait ? 740 : 840), vh_ / 760);
    var m = 1, sy = 1;
    if (mobile) {
      m = Math.max(1, (portrait ? 1.25 : 1.1) / s);                 // smallest word is about 7px on screen
      if (portrait) sy = Math.max(1, Math.min(1.5, vh_ * 0.6 / (614 * s)));   // use the tall screen: stretch the heart upward
    }
    return { S: s, M: Math.round(Math.min(3, m) * 10) / 10, SY: Math.round(sy * 10) / 10 };
  }

  function inside(x, y) {
    var ix = Math.round(x), iy = Math.round(y);
    return ix >= 0 && iy >= 0 && ix < W && iy < HH && MASK[iy * W + ix] === 1;
  }
  function tw(pi, size) {
    var key = pi * 1000 + size;
    if (wcache[key] === undefined) { ctx.font = "bold " + size + "px " + FONT; wcache[key] = ctx.measureText(PHRASES[pi]).width; }
    return wcache[key];
  }
  function edgeDist(x, y) {
    var m = 1e9;
    for (var i = 0; i < poly.length; i++) { var d = Math.hypot(poly[i][0] - x, poly[i][1] - y); if (d < m) m = d; }
    return m;
  }
  function occupy(o) {
    var c0 = Math.max(0, Math.floor((o.x - o.hw) / G)), c1 = Math.min(GN - 1, Math.floor((o.x + o.hw) / G));
    var r0 = Math.max(0, Math.floor((o.y - o.hh) / G)), r1 = Math.min(GR - 1, Math.floor((o.y + o.hh) / G));
    for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) (grid[r * GN + c] = grid[r * GN + c] || []).push(o);
  }
  function colorFor(pi, y) {
    var f = Math.min(1, Math.max(0, (y - (CY - 307 * SY)) / (614 * SY)));
    return pi === 0 ? "hsl(335,100%,94%)" : "hsl(" + (328 + f * 22 + (rnd() - 0.5) * 8) + ",85%," + Math.round(68 + rnd() * 14) + "%)";
  }
  // place one phrase if it fits inside the heart without touching the others
  function tryPlace(pi, size, x, y, tight) {
    var hw = tw(pi, size) / 2, hh = size * 1.15 / 2;

    var ih = Math.max(1, hw - 1), iv = Math.max(0, hh - 4 * MG);

    for (var p = 0; p < pts.length; p++) if (!inside(x + pts[p][0], y + pts[p][1])) return null;
    var pad = 6 * MG;
    var c0 = Math.max(0, Math.floor((x - hw - pad) / G)), c1 = Math.min(GN - 1, Math.floor((x + hw + pad) / G));
    var r0 = Math.max(0, Math.floor((y - hh - pad) / G)), r1 = Math.min(GR - 1, Math.floor((y + hh + pad) / G));
    for (var gy2 = r0; gy2 <= r1; gy2++) for (var gx2 = c0; gx2 <= c1; gx2++) {
      var cell = grid[gy2 * GN + gx2];
      if (!cell) continue;
      for (var q = 0; q < cell.length; q++) {
        var o = cell[q], mx = (o.b ? (tight ? 0 : 2) : (tight ? 1 : 3)) * MG, my = (o.b ? (tight ? 0 : 2) : (tight ? 1 : 2)) * MG;
        if (Math.abs(x - o.x) < hw + o.hw + mx && Math.abs(y - o.y) < hh + o.hh + my) return null;
      }
    }
    var it = { text: PHRASES[pi], pi: pi, size: size, x: x, y: y, hw: hw, hh: hh, edge: edgeDist(x, y),
      ang: (Math.atan2(y - CY, x - W / 2) + Math.PI * 2 + Math.PI / 2) % (Math.PI * 2), fade: 450, color: colorFor(pi, y) };
    items.push(it); occupy({ x: x, y: y, hw: hw, hh: hh, b: false });
    return it;
  }
  function refill() {
    deck = [];
    for (var i = 1; i < PHRASES.length; i++) if (!prePlaced[i]) deck.push(i);
    if (!deck.length) for (var i3 = 1; i3 < PHRASES.length; i3++) deck.push(i3);
    for (var j = deck.length - 1; j > 0; j--) { var k = Math.floor(rnd() * (j + 1)), tmp = deck[j]; deck[j] = deck[k]; deck[k] = tmp; }
  }
  var yTop = 0, yBot = 0, RF = 1;
  function R(n) { return Math.max(1, Math.round(n * M)); }                            // small words: scaled so they stay readable
  function RB(n) { return Math.max(R(7), Math.round(n * MB * RF)); }                  // big words (RF shrinks them until every language fits)

  // steps 1-3: the big English line, then every language gets a seat. Returns how many languages found a seat.
  function seat(f) {
    RF = f; seed = 11; items = []; grid = [];
    var RS = (M > 1.05 ? 20 : 22) * MB * f;                                           // row height

    // 1) the big English "I love you" in the middle (the only English one)
    hero = null;
    var spots = [[400, CY - 60 * SY], [400, CY - 40 * SY], [400, CY - 80 * SY], [400, CY - 20 * SY]];
    for (var hs = Math.round(54 * Math.max(1, M * 0.5)); hs >= 54 && !hero; hs -= 4)

      for (var wi = 1; wi < PHRASES.length; wi++) wide.push([tw(wi, RB(10)), wi]);
      wide.sort(function (a, b) { return b[0] - a[0]; });
      for (var wj = 0; wj < 24; wj++) {
        var wp = wide[wj][1], ok = false;
        for (var wsz = RB(10); wsz >= R(7) && !ok; wsz--) {
          for (var wt = 0; wt < 300 && !ok; wt++) {
            var wy = yTop + 10 * MB * f + Math.floor(rnd() * nRows) * RS;
            if (tryPlace(wp, wsz, 60 + rnd() * 680, wy)) { ok = true; placed[wp] = true; prePlaced[wp] = true; }

    }

    deck = []; pend = null; pendFails = 0;
    for (var yc = yTop + 10 * MB * f; yc < yBot - 4 * SY; yc += RS) {
      var cx = 56, guard = 0;

        if (!inside(cx + 4, yc)) { cx += 6; continue; }
        if (pend === null) { if (!deck.length) refill(); pend = deck.pop(); pendFails = 0; }
        var chars = Array.from(PHRASES[pend]).length;
        var cap = Math.max(9, Math.min(20, 130 / (chars * 0.56)));            // long phrases get smaller type
        var want = Math.min(Math.round(cap), 10 + Math.floor(rnd() * 8)), got = null;
        for (var sz = want; sz >= 9 && !got; sz--) {

          if (got) cx += ww + (7 + rnd() * 9) * MG;

      }

    for (var m = 1; m < PHRASES.length; m++) {
      if (placed[m]) continue;
      for (var sz2 = R(11); sz2 >= R(6) && !placed[m]; sz2--) {
        for (var gy = yTop; gy < yBot - 2 && !placed[m]; gy += 3 * M) {
          for (var gx = 56; gx < 744; gx += 4 * M) {
            var gw = tw(m, sz2);
            if (tryPlace(m, sz2, gx + gw / 2, gy)) { placed[m] = true; break; }
          }
        }
      }
    }
    return Object.keys(placed).length;
  }

  function setScale(m) {
    M = m;
    MB = 1 + (M - 1) * 0.55;   // big words grow less than the smallest words, so the heart shape stays crisp
    MG = 1 + (M - 1) * 0.3;    // gaps between words
  }

  function build(cfg) {
    setScale(cfg.M); SY = cfg.SY;
    CY = Math.round(307 * SY + 63); HH = Math.ceil(CY + 307 * SY + 123);
    GR = Math.ceil(HH / G);
    wcache = {}; items = []; grid = []; fillIdx = [];

    // heart outline polygon (logical space, W wide)
    poly = [];
    for (var i = 0; i < 360; i++) {
      var a = i / 360 * Math.PI * 2;
      var X = 16 * Math.pow(Math.sin(a), 3);
      var Y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);

    }

    for (var y = 0; y < HH; y++) {

      for (var i2 = 0, j2 = poly.length - 1; i2 < poly.length; j2 = i2++) {
        var yi = poly[i2][1], yj = poly[j2][1];
        if ((yi > yy) !== (yj > yy)) xs.push((poly[j2][0] - poly[i2][0]) * (yy - yi) / (yj - yi) + poly[i2][0]);
      }
      xs.sort(function (p, q) { return p - q; });
      for (var k = 0; k + 1 < xs.length; k += 2)
        for (var x = Math.max(0, Math.ceil(xs[k] - 0.5)); x <= Math.min(W - 1, Math.floor(xs[k + 1] - 0.5)); x++) MASK[y * W + x] = 1;
    }
    PHRASES.forEach(function (p, i) { if (i > 0 && Array.from(p).length <= 13) fillIdx.push(i); });
    yTop = CY - 308 * SY; yBot = CY + 324 * SY;

    // seat every language; on phones, shrink the big words step by step until all of them fit
    var f = 1, relax = 0;
    for (;;) {
      seat(f);
      if (M <= 1.05 || Object.keys(placed).length >= PHRASES.length) break;
      if (f > 0.5) { f = Math.round((f - 0.06) * 100) / 100; continue; }
      if (M > 1.5 && relax++ < 4) { setScale(Math.round((M - 0.2) * 10) / 10); f = 1; continue; }   // very small screen: allow slightly smaller type
      break;
    }

    var fc = 0, top4 = M > 1.05 ? Math.min(R(14), RB(12)) : 14, top5 = M > 1.05 ? Math.min(R(10), RB(9)) : 10;
    for (var fy = yTop; fy < yBot; fy += 3 * M) {
      for (var fx = 50; fx < 750; fx += 3 * M) {
        if (!inside(fx + 2, fy)) continue;
        var done = false;
        for (var fs = top4; fs >= R(8) && !done; fs--) {
          for (var tr = 0; tr < 4 && !done; tr++) {
            var pj = fillIdx[(fc + tr) % fillIdx.length], fw = tw(pj, fs);
            if (tryPlace(pj, fs, fx + fw / 2, fy)) { done = true; fc += tr + 1; fx += fw; }
          }
        }
      }
    }
    // 5) last pass: tuck tiny words into every leftover nook so the outline is crisp all the way round
    for (var ty = yTop; ty < yBot; ty += 2 * M) {
      for (var tx = 50; tx < 750; tx += 2 * M) {
        if (!inside(tx + 1, ty)) continue;
        var done2 = false;
        for (var ts = top5; ts >= R(6) && !done2; ts--) {
          for (var tr2 = 0; tr2 < 6 && !done2; tr2++) {
            var pk = fillIdx[(fc + tr2) % fillIdx.length], tww = tw(pk, ts);
            if (tryPlace(pk, ts, tx + tww / 2, ty, true)) { done2 = true; fc += tr2 + 1; tx += tww; }
          }

    }

    var inner = rest.filter(function (it) { return it.edge >= 30 * MB; }).sort(function () { return rnd() - 0.5; });

    order.forEach(function (it, i) { it.delay = tt; tt += i < outline.length ? 45 : 20; });
    if (hero) { hero.delay = tt + 250; hero.fade = 1400; order.push(hero); tt += 250 + 1400; }

  }

  // ---------- lilies ----------
  var PAL = [
    { c0: "#e0407f", c1: "#ff8ebb", c2: "#ffe6f0", edge: "rgba(255,255,255,.55)", rib: "rgba(255,255,255,.5)", spot: "rgba(168,16,80,.75)", throat: "rgba(205,235,130,.9)", fil: "#f6e6c8", anther: "#b5470f" },
    { c0: "#d9eab0", c1: "#ffffff", c2: "#fff0f6", edge: "rgba(255,160,195,.7)", rib: "rgba(190,220,140,.7)", spot: "rgba(205,110,150,.5)", throat: "rgba(190,230,120,.9)", fil: "#fff8e1", anther: "#d9731f" }
  ];
  function makeLily(p) {
    var c = document.createElement("canvas"); c.width = c.height = 512;
    var g = c.getContext("2d"); g.translate(256, 256);
    var R = 240;
    for (var i = 0; i < 6; i++) {
      var outer = i % 2 === 0, len = R * (outer ? 1 : 0.93), wid = R * (outer ? 0.40 : 0.34);
      g.save(); g.rotate(i * Math.PI / 3 - Math.PI / 2);
      var gr = g.createLinearGradient(0, 0, len, 0);
      gr.addColorStop(0, p.c0); gr.addColorStop(0.35, p.c1); gr.addColorStop(1, p.c2);
      g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0);
      g.bezierCurveTo(len * 0.2, -wid, len * 0.7, -wid * 0.85, len, 0);
      g.bezierCurveTo(len * 0.7, wid * 0.85, len * 0.2, wid, 0, 0);

      g.strokeStyle = p.rib; g.lineWidth = 3; g.beginPath(); g.moveTo(len * 0.08, 0); g.lineTo(len * 0.82, 0); g.stroke();

      g.save(); g.translate(ex, ey); g.rotate(ang + 0.5); g.fillStyle = p.anther;

  }
  var sprites = [makeLily(PAL[0]), makeLily(PAL[1])];
  var LILIES = [
    { fx: .07, fy: .12, s: .30, rot: .2,  v: 0, t: 1800, ph: 0 },
    { fx: .93, fy: .14, s: .27, rot: 1.0, v: 1, t: 2500, ph: 1.3 },
    { fx: .06, fy: .90, s: .27, rot: .6,  v: 1, t: 3200, ph: 2.1 },
    { fx: .94, fy: .90, s: .31, rot: .1,  v: 0, t: 3900, ph: 3.4 },
    { fx: .50, fy: .05, s: .18, rot: .9,  v: 1, t: 4600, ph: 4.2 },
    { fx: .50, fy: .96, s: .19, rot: .3,  v: 0, t: 5200, ph: 5.1 }
  ];

  // petal shape pointing along x
  function petal(s) {
    ctx.beginPath(); ctx.moveTo(-s, 0);
    ctx.bezierCurveTo(-s * 0.4, -s * 0.6, s * 0.5, -s * 0.55, s, 0);

  }
  var PCOL = ["#ffb3d1", "#ff8fb8", "#fff0f6", "#ff9ec7"];

  // full-screen sizing: background, lilies and drifting petals cover the whole window

    var n = Math.round(Math.min(80, Math.max(35, vw * vh / 16000)));
    pollen = []; fall = [];
    for (var k = 0; k < n; k++) pollen.push({ x: Math.random() * vw, y: Math.random() * vh, r: 0.6 + Math.random() * 1.5, v: 6 + Math.random() * 12, ph: Math.random() * 6.28 });
    for (var f = 0; f < Math.round(n / 2.5); f++) fall.push({ x: Math.random() * vw, y: Math.random() * vh, s: 6 + Math.random() * 9, v: 16 + Math.random() * 20,
      ph: Math.random() * 6.28, rot: Math.random() * 6.28, vr: (Math.random() - .5) * 1.2, c: PCOL[f % PCOL.length] });
  }
  window.addEventListener("resize", resize);
  resize();

  // petal burst when the heart completes
  var bursts = [];
  function spawn(n) {
    for (var i = 0; i < n; i++) {
      var it = order[Math.floor(Math.random() * order.length)];
      bursts.push({ x: it.x, y: it.y, vy: 40 + Math.random() * 80, vx: (Math.random() - .5) * 40, size: (6 + Math.random() * 9) * Math.max(1, 0.8 / S),
        age: 0, life: 2.8 + Math.random() * 2, ph: Math.random() * 6.28, rot: Math.random() * 6.28, vr: (Math.random() - .5) * 3, c: PCOL[i % PCOL.length] });
    }
  }

  var start = performance.now(), last = start, flash = null, nextFlash = 0, burst = false, nextSmall = 0;
  cv.addEventListener("click", function () { start = performance.now(); flash = null; nextFlash = 0; burst = false; bursts = []; });

  function draw(now) {
    var el = now - start, dt = Math.min(0.05, (now - last) / 1000); last = now;

    // screen space: background, lilies, pollen, falling petals
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, vw, vh);

    var mn = Math.min(vw, vh);
    for (var l = 0; l < LILIES.length; l++) {
      var Li = LILIES[l], b = (el - Li.t) / 3000;
      if (b <= 0) continue;
      if (b > 1) b = 1;
      var e = 1 + 2.70158 * Math.pow(b - 1, 3) + 1.70158 * Math.pow(b - 1, 2);   // ease out back: a soft bloom
      var sz = mn * Li.s * e, rot = Li.rot + 0.6 * (1 - b) + Math.sin(el / 2600 + Li.ph) * 0.05;
      ctx.save();
      ctx.translate(Li.fx * vw, Li.fy * vh + Math.sin(el / 3000 + Li.ph) * 4);
      ctx.rotate(rot);
      ctx.globalAlpha = Math.min(1, b * 2.2) * 0.93;
      ctx.shadowColor = "rgba(255,120,180,.45)"; ctx.shadowBlur = 28;
      ctx.drawImage(sprites[Li.v], -sz / 2, -sz / 2, sz, sz);
      ctx.restore();
    }
    ctx.shadowBlur = 0;
    for (var k = 0; k < pollen.length; k++) {
      var sp = pollen[k];
      sp.y -= sp.v * dt; if (sp.y < -4) { sp.y = vh + 4; sp.x = Math.random() * vw; }
      ctx.globalAlpha = 0.25 + 0.25 * Math.sin(el / 700 + sp.ph);
      ctx.fillStyle = "#ffd08a";
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, 6.2832); ctx.fill();
    }
    for (var q = 0; q < fall.length; q++) {
      var fp = fall[q];
      fp.y += fp.v * dt; fp.rot += fp.vr * dt;
      if (fp.y > vh + 20) { fp.y = -20; fp.x = Math.random() * vw; }
      ctx.save();
      ctx.translate(fp.x + Math.sin(el / 1500 + fp.ph) * 26, fp.y); ctx.rotate(fp.rot);
      ctx.globalAlpha = 0.5; ctx.fillStyle = fp.c; petal(fp.s); ctx.fill();
      ctx.restore();
    }

    if (el > doneAt && !burst) { burst = true; spawn(60); nextSmall = el + 5000; }
    if (burst && el > nextSmall) { spawn(8); nextSmall = el + 5000; }

    // heartbeat once complete
    var sc = 1;
    if (el > doneAt) {
      var ph = ((el - doneAt) % 1600) / 1600;
      sc = 1 + 0.022 * (Math.exp(-Math.pow((ph - 0.08) / 0.05, 2)) + 0.7 * Math.exp(-Math.pow((ph - 0.26) / 0.06, 2)));
    }
    if (el > doneAt && el > nextFlash) {
      var cand = order[Math.floor(Math.random() * order.length)];
      if (!cand.hero) { flash = { it: cand, t0: el }; nextFlash = el + 900; }
    }

    // heart words in logical space, centred on screen
    ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * (vw / 2 - W / 2 * S), dpr * (vh / 2 - CY * S));
    ctx.save();
    ctx.translate(W / 2, CY); ctx.scale(sc, sc); ctx.translate(-W / 2, -CY);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (var i = 0; i < order.length; i++) {
      var it = order[i], a = (el - it.delay) / it.fade;
      if (a <= 0) continue;
      if (a > 1) a = 1;
      var ea = 1 - Math.pow(1 - a, 3);
      var scale = 0.85 + 0.15 * ea, color = it.color, glow = 7, gcol = GLOW;
      if (it.hero) {
        var br = Math.sin(el / 650);
        scale *= 1 + 0.025 * br; glow = 24 + 8 * br; gcol = "rgba(255,190,225,.95)";
      } else if (it.en) { glow = 12; gcol = "rgba(255,190,225,.9)"; }
      if (flash && flash.it === it && el - flash.t0 < 1100) {
        var fl = (el - flash.t0) / 1100, pulse = Math.sin(fl * Math.PI);
        scale += 0.28 * pulse; glow += 18 * pulse; color = "hsl(335,100%," + Math.round(72 + 26 * pulse) + "%)"; gcol = "#fff";
      }
      ctx.globalAlpha = ea;
      ctx.shadowColor = gcol; ctx.shadowBlur = glow;
      ctx.fillStyle = color;
      ctx.font = "bold " + (it.size * scale) + "px " + FONT;
      if (it.rot !== undefined) { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot); ctx.fillText(it.text, 0, 0); ctx.restore(); }
      else ctx.fillText(it.text, it.x, it.y);
    }
    ctx.restore();

    // petals rising from the heart
    ctx.shadowBlur = 0;
    for (var n = bursts.length - 1; n >= 0; n--) {
      var bp = bursts[n]; bp.age += dt;
      if (bp.age > bp.life) { bursts.splice(n, 1); continue; }
      bp.y -= bp.vy * dt; bp.x += (bp.vx + Math.sin(bp.age * 2 + bp.ph) * 18) * dt; bp.rot += bp.vr * dt;
      var lf = bp.age / bp.life;
      ctx.save(); ctx.translate(bp.x, bp.y); ctx.rotate(bp.rot);
      ctx.globalAlpha = Math.sin(Math.min(1, lf * 1.4) * Math.PI * 0.5) * (1 - lf) * 0.9;
      ctx.fillStyle = bp.c; petal(bp.size); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
